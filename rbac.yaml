---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-restart
  namespace: toggle-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-restart
  namespace: toggle-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing-restart
subjects:
  - kind: Group
    name: self-healing
    apiGroup: rbac.authorization.k8s.io